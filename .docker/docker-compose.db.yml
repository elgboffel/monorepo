# Database services for Grably
services:
  postgres:
    image: postgres:16-alpine
    container_name: grably-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: grably
      POSTGRES_USER: grably
      POSTGRES_PASSWORD: grably_dev_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U grably -d grably']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
